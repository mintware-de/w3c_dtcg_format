# Publishes to pub.dev via OIDC trusted publisher.
#
# One-time setup (first release is manual):
#   1. The first release of a package cannot use the trusted publisher — pub.dev
#      requires the package to already exist. Run `dart pub publish` locally
#      once for 0.1.0.
#   2. On pub.dev → admin → Automated publishing, enable the GitHub Actions
#      publisher: repository `mintware-de/w3c_dtcg_format`, tag pattern
#      `v{{version}}`.
#   3. After that, pushing a `vX.Y.Z` tag runs this workflow and publishes
#      automatically. No secrets.
name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  id-token: write
  contents: read

jobs:
  tag-check:
    name: Verify tag matches pubspec version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag against pubspec.yaml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          echo "Tag:     $TAG"
          echo "Pubspec: $PUBSPEC"
          if [ "$TAG" != "$PUBSPEC" ]; then
            echo "::error::Tag v$TAG does not match pubspec version $PUBSPEC"
            exit 1
          fi

  publish:
    needs: tag-check
    # id-token must be re-declared here — reusable workflows do not inherit
    # the workflow-level permissions block.
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
